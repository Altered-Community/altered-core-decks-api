services:
    logger:
        class: Psr\Log\NullLogger

    altered_core.mock_http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        public: true

    App\Client\AlteredCoreClient:
        autowire: true
        arguments:
            $httpClient: '@altered_core.mock_http_client'
            $alteredCoreUrl: '%env(ALTERED_CORE_URL)%'
        tags: ['app.card_data_provider']

    App\Client\RustCardsApiProvider:
        autowire: true
        arguments:
            $httpClient: '@altered_core.mock_http_client'
            $rustCardsApiUrl: '%env(RUST_CARDS_API_URL)%'
        tags: ['app.card_data_provider']

    App\Client\CardDataProviderFactory:
        arguments:
            $providers: !tagged_iterator app.card_data_provider
            $activeProvider: '%env(CARD_DATA_PROVIDER)%'

    altered_draft.mock_http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        public: true

    App\Client\AlteredDraftSealedPoolClient:
        autowire: true
        arguments:
            $httpClient: '@altered_draft.mock_http_client'
            $alteredDraftUrl: '%env(ALTERED_DRAFT_URL)%'

    # Keycloak JWKS endpoint: tests never reach the network. Without a response factory
    # the fetch fails and every non-dev token is rejected.
    keycloak.mock_http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        public: true

    App\Service\KeycloakJwtDecoder:
        autowire: true
        arguments:
            $httpClient: '@keycloak.mock_http_client'
            $keycloakBaseUrl: '%keycloak_base_url%'
            $keycloakRealm: '%keycloak_realm%'
            $appSecret: '%env(APP_SECRET)%'
            $devAuthEnabled: '%env(bool:DEV_AUTH_ENABLED)%'
