parameters:
    keycloak_base_url: '%env(KEYCLOAK_BASE_URL)%'
    keycloak_realm: '%env(KEYCLOAK_REALM)%'
    keycloak_client_id: '%env(KEYCLOAK_CLIENT_ID)%'
    keycloak_client_secret: '%env(KEYCLOAK_CLIENT_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\KeycloakJwtDecoder:
        arguments:
            $keycloakBaseUrl: '%keycloak_base_url%'
            $keycloakRealm: '%keycloak_realm%'
            $appSecret: '%env(APP_SECRET)%'
            $devAuthEnabled: '%env(bool:DEV_AUTH_ENABLED)%'

    App\Security\KeycloakAuthenticator:
        arguments:
            $auditLogger: '@monolog.logger.audit'

    App\EventSubscriber\ApiAuditSubscriber:
        arguments:
            $auditLogger: '@monolog.logger.audit'

    App\EventSubscriber\FixtureProductionGuard:
        arguments:
            $env: '%kernel.environment%'

    App\Controller\DevAuthController:
        arguments:
            $appSecret: '%env(APP_SECRET)%'
            $devAuthEnabled: '%env(bool:DEV_AUTH_ENABLED)%'

    App\Controller\DevDebugController:
        arguments:
            $kernelDebug: '%kernel.debug%'
            $devAuthEnabled: '%env(bool:DEV_AUTH_ENABLED)%'

    App\Client\AlteredCoreClient:
        arguments:
            $alteredCoreUrl: '%env(ALTERED_CORE_URL)%'

    App\Client\RustCardsApiProvider:
        arguments:
            $rustCardsApiUrl: '%env(RUST_CARDS_API_URL)%'

    App\Client\CardDataProviderFactory:
        arguments:
            $providers: !tagged_iterator app.card_data_provider
            $activeProvider: '%env(CARD_DATA_PROVIDER)%'

    App\Validator\Format\DeckFormatValidatorFactory:
        arguments:
            - !tagged_iterator app.deck_format_validator

    _instanceof:
        App\Validator\Format\DeckFormatValidatorInterface:
            tags: ['app.deck_format_validator']
        App\Client\CardDataProviderInterface:
            tags: ['app.card_data_provider']

when@prod:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Service\KeycloakJwtDecoder:
            arguments:
                $keycloakBaseUrl: '%keycloak_base_url%'
                $keycloakRealm: '%keycloak_realm%'
                $appSecret: '%env(APP_SECRET)%'
                $devAuthEnabled: false

        App\Controller\DevAuthController:
            arguments:
                $appSecret: '%env(APP_SECRET)%'
                $devAuthEnabled: false

        App\Controller\DevDebugController:
            arguments:
                $kernelDebug: '%kernel.debug%'
                $devAuthEnabled: false
