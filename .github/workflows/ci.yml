name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PHP_EXTENSIONS: pdo_pgsql, apcu, intl, zip

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        env:
          COMPOSER_HOME: /tmp/composer
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Upload vendor
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ github.sha }}
          path: vendor/
          retention-days: 1

  code-quality:
    name: Code Quality
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Download vendor
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ github.sha }}
          path: vendor/

      - name: Restore vendor bin permissions
        run: chmod +x vendor/bin/*

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Warm up dev cache (for PHPStan Symfony extension)
        env:
          APP_ENV: dev
          APP_SECRET: ci-secret
          DATABASE_URL: postgresql://ci:ci@localhost/ci?serverVersion=16&charset=utf8
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        env:
          APP_ENV: dev
          APP_SECRET: ci-secret
          DATABASE_URL: postgresql://ci:ci@localhost/ci?serverVersion=16&charset=utf8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  tests:
    name: Tests PHP ${{ matrix.php }}
    needs: setup
    # Secrets (DATABASE_URL) are not available on fork PRs — skip tests there.
    # They run on push to main and on PRs opened from within the same repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    strategy:
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Download vendor
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ github.sha }}
          path: vendor/

      - name: Restore vendor bin permissions
        run: chmod +x vendor/bin/*

      - name: Sanity check — TEST_DATABASE_URL must not be production
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if echo "$DATABASE_URL" | grep -qiE '\bprod\b|\blive\b|\bmain\b'; then
            echo "::error::TEST_DATABASE_URL contains a production keyword (prod/live/main). Aborting to prevent data loss."
            exit 1
          fi
          if ! echo "$DATABASE_URL" | grep -qiE 'test|ci|staging'; then
            echo "::error::TEST_DATABASE_URL does not contain 'test', 'ci', or 'staging'. Verify the GitHub secret before running schema:drop."
            exit 1
          fi

      - name: Prepare test database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          php bin/console doctrine:schema:drop --full-database --force --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Run unit tests
        run: php bin/phpunit --testsuite Unit --no-coverage

      - name: Run integration tests
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: php bin/phpunit --testsuite Integration --no-coverage

